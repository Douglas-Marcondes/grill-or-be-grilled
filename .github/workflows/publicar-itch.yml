# Exporta a versão Web (a mesma de tools/exportar.sh web) e publica no itch.io,
# para jogar no celular pelo navegador. Usa o butler, a ferramenta oficial de
# upload do itch.io.
#
# O caminho principal é o GitHub Pages (publicar-web.yml), automático a cada
# push. Este fica pronto para quando quiserem lançar no itch.io: roda só à mão
# (Actions -> Publicar no itch.io -> Run workflow), para não exportar o jogo
# duas vezes a cada push.
#
# Configuração, uma vez (README, "Publicar no itch.io"):
#   - secret   BUTLER_API_KEY : chave em https://itch.io/user/settings/api-keys
#   - variável ITCH_JOGO      : "usuario/pagina-do-jogo", como na URL do itch
# Sem eles o workflow exporta e avisa, mas não falha.
name: Publicar no itch.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itch
  cancel-in-progress: true

env:
  GODOT_VERSAO: 4.7.2
  GODOT_TEMPLATES: ~/.local/share/godot/export_templates/4.7.2.stable

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSAO}-stable/Godot_v${GODOT_VERSAO}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSAO}-stable_linux.x86_64" godot

      # O pacote de templates tem 1,3 GB; so o template Web sem threads e
      # usado (preset "Web" em export_presets.cfg), e ele fica em cache.
      - name: Cache do template Web
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_TEMPLATES }}
          key: godot-${{ env.GODOT_VERSAO }}-web-nothreads

      - name: Baixar template Web
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSAO}-stable/Godot_v${GODOT_VERSAO}-stable_export_templates.tpz"
          unzip -q templates.tpz templates/web_nothreads_release.zip templates/version.txt
          mkdir -p ${{ env.GODOT_TEMPLATES }}
          mv templates/* ${{ env.GODOT_TEMPLATES }}/

      - name: Exportar
        run: |
          mkdir -p exportar/web
          ./godot --headless --path grill-or-be-grilled --export-release "Web" ../exportar/web/index.html
          test -s exportar/web/index.wasm

      - name: Publicar com butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_JOGO: ${{ vars.ITCH_JOGO }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_JOGO" ]; then
            echo "::warning::itch.io não configurado (secret BUTLER_API_KEY e variável ITCH_JOGO). Build exportado, mas não publicado."
            exit 0
          fi
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          # Canal "html5": o itch reconhece a pasta com index.html como jogo
          # de navegador. A versão é o commit, para saber o que está no ar.
          ./butler/butler push exportar/web "$ITCH_JOGO:html5" --userversion "${GITHUB_SHA::7}"
